<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mini Militia — Lobby</title>
<style>
:root{--bg:#0d1510;--panel:#19251d;--panel2:#25352a;--green:#a1d580;--cyan:#00daf3;--gold:#ffb955;--text:#dbe5db;--muted:#aab5a6}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% 0,#304331,#0d1510 60%);color:var(--text);font-family:Arial,sans-serif;min-height:100vh}header{position:sticky;top:0;z-index:2;background:#101a13ee;backdrop-filter:blur(12px);padding:16px;display:flex;justify-content:space-between;align-items:center;border-bottom:2px solid #344738}h1{margin:0;font-size:clamp(24px,5vw,42px)}button{border:0;border-radius:9px;padding:11px 15px;background:var(--panel2);color:var(--text);cursor:pointer;font-weight:bold}button:hover{filter:brightness(1.2)}main{max-width:900px;margin:auto;padding:18px}.card{background:#19251dee;border:1px solid #405542;border-radius:15px;padding:16px;margin-bottom:14px;box-shadow:0 10px 25px #0005}.room{display:flex;gap:12px;justify-content:space-between;align-items:center;flex-wrap:wrap}.code{color:var(--cyan);font-family:monospace}.teams{display:grid;grid-template-columns:1fr 1fr;gap:14px}.team{padding:12px;border-radius:12px;background:#111b14;border-top:4px solid var(--cyan)}.team.bravo{border-top-color:var(--gold)}.player{display:flex;align-items:center;justify-content:space-between;padding:10px;margin:7px 0;background:var(--panel2);border-radius:8px}.ready{color:var(--green);font-size:13px}.radio{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.action{width:100%;background:var(--gold);color:#342000;font-size:18px}.nav{display:flex;gap:8px;flex-wrap:wrap}.nav a{color:var(--text);text-decoration:none;background:var(--panel2);padding:10px 13px;border-radius:8px}@media(max-width:650px){.teams{grid-template-columns:1fr}.radio{grid-template-columns:1fr}}
</style></head>
<body><header><h1>LOBBY / غرفة النخبة</h1><div class="nav"><a href="mini_militia_armory.html">الترسانة</a><a href="mini_militia_combat.html">القتال</a></div></header><main>
<section class="card room"><div><h2>غرفة النخبة #8429</h2><div>كود الدعوة: <b class="code">MM-8429</b> <button id="copy">نسخ</button></div></div><span>🟢 24ms — الشرق الأوسط</span></section>
<section class="card"><h2>اختيار الفريق</h2><p>أنت حالياً في: <b id="current" style="color:var(--cyan)">الفريق الأزرق</b></p><button id="switch">الانتقال للبرتقالي</button></section>
<section class="teams"><div class="team"><h2 style="color:var(--cyan)">🔵 ALPHA <small>3 / 4</small></h2><div class="player">العقيد صخر (أنت)<span class="ready">✓ جاهز</span></div><div class="player">الشبح_99<span class="ready">✓ جاهز</span></div><div class="player">فهد_الصحراء<span style="color:var(--gold)">تجهيز...</span></div><button class="invite">＋ دعوة صديق</button></div><div class="team bravo"><h2 style="color:var(--gold)">🟠 BRAVO <small>3 / 4</small></h2><div class="player">المدمر_X<span class="ready">✓ جاهز</span></div><div class="player">النسر<span class="ready">✓ جاهز</span></div><div class="player">كابوس_الليل<span class="ready">✓ جاهز</span></div><button class="invite">＋ دعوة صديق</button></div></section>
<section class="card"><h2>📢 اللاسلكي السريع</h2><div class="radio"><button data-msg="إلى الهجوم الشامل!">إلى الهجوم!</button><button data-msg="غطّوا ظهري الآن!">غطّوا ظهري!</button><button data-msg="أحتاج وقود نفاثة!">أحتاج نفاثة!</button></div><p id="radio" style="color:var(--green)"></p></section>
<section class="card"><button class="action" id="start">⚔ بدء المعركة</button></section>
</main><script>
const notify=t=>{const p=document.createElement('div');p.textContent=t;p.style='position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#253b29;color:#dfffc8;padding:12px 18px;border-radius:9px;z-index:5';document.body.append(p);setTimeout(()=>p.remove(),2200)};
document.querySelector('#copy').onclick=async()=>{try{await navigator.clipboard.writeText('MM-8429')}catch{}notify('تم نسخ كود الغرفة')};document.querySelector('#switch').onclick=e=>{const c=document.querySelector('#current');const blue=c.textContent.includes('الأزرق');c.textContent=blue?'الفريق البرتقالي':'الفريق الأزرق';e.target.textContent=blue?'الانتقال للأزرق':'الانتقال للبرتقالي';notify('تم تغيير الفريق')};document.querySelectorAll('[data-msg]').forEach(b=>b.onclick=()=>document.querySelector('#radio').textContent='العقيد صخر: '+b.dataset.msg);document.querySelectorAll('.invite').forEach(b=>b.onclick=()=>notify('تم إرسال دعوة لصديق'));document.querySelector('#start').onclick=e=>{e.textContent='⟳ جارٍ بدء المعركة...';setTimeout(()=>{location.href='mini_militia_combat.html'},1200)};
</script></body></html>
