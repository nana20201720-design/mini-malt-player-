<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>تخصيص المحارب</title>
<style>
:root{--bg:#0b120d;--panel:#19251b;--card:#233326;--line:#405b43;--green:#63e38a;--gold:#ffbf3f;--cyan:#3be5ff;--purple:#d875ff;--text:#f1f5e9}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 50% 10%,#30472f,#0b120d 65%);color:var(--text);font-family:Arial,sans-serif}header{position:sticky;top:0;z-index:5;background:#111b14ed;backdrop-filter:blur(12px);border-bottom:3px solid #314632;padding:12px 16px;display:flex;align-items:center;justify-content:space-between}header a{color:#fff;text-decoration:none;background:#263a2a;padding:9px 12px;border-radius:8px}h1{margin:0;color:var(--gold);font-size:clamp(22px,5vw,38px)}main{max-width:900px;margin:auto;padding:16px}.stage{position:relative;min-height:360px;display:flex;flex-direction:column;align-items:center;justify-content:center;background:linear-gradient(#18291c,#0c150e);border:2px solid var(--line);border-radius:16px;overflow:hidden;box-shadow:0 12px 28px #0008}.stage:before{content:"";position:absolute;inset:0;background:radial-gradient(#48e4d822 1px,transparent 1px);background-size:18px 18px}.soldier{position:relative;z-index:1;font-size:130px;filter:drop-shadow(0 18px 8px #000);animation:float 2.5s ease-in-out infinite}.aura{position:absolute;width:210px;height:70px;border-radius:50%;background:#3be5ff55;filter:blur(25px);animation:pulse 1.6s infinite}.flame{position:absolute;z-index:1;font-size:65px;color:var(--purple);text-shadow:0 0 25px #d875ff;animation:flame .25s infinite alternate}.info{position:relative;z-index:2;text-align:center}.info h2{margin:8px 0 2px}.info p{margin:0;color:var(--green)}.actions,.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}.tabs{grid-template-columns:repeat(4,1fr)}button{border:0;border-radius:9px;padding:11px;background:var(--card);color:var(--text);font-weight:bold;cursor:pointer;transition:.18s}button:hover,button.active{filter:brightness(1.25);box-shadow:0 0 18px #63e38a55;transform:translateY(-2px)}.tabs button.active{background:var(--green);color:#09200e}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:12px}.item{position:relative;background:#17231a;border:2px solid var(--line);border-radius:12px;padding:12px;text-align:center;cursor:pointer;transition:.2s}.item:hover,.item.equipped{border-color:var(--gold);box-shadow:0 0 18px #ffbf3f44;transform:translateY(-3px)}.item .icon{font-size:46px;margin:5px}.item small{display:block;color:#b5c5b4;margin:5px}.item .equip{background:var(--green);color:#09200e;width:100%}.locked{opacity:.55}.locked .equip{background:#4b514b;color:#ddd}.toast{position:fixed;bottom:20px;left:50%;z-index:10;transform:translate(-50%,20px);opacity:0;background:#17251d;border:2px solid var(--green);padding:12px 18px;border-radius:9px;transition:.25s}.toast.show{opacity:1;transform:translate(-50%,0)}@keyframes float{50%{transform:translateY(-15px) rotate(-2deg)}}@keyframes pulse{50%{transform:scale(1.15);opacity:.7}}@keyframes flame{to{transform:scale(1.18) translateY(5px);opacity:.65}}@media(max-width:600px){.grid{grid-template-columns:repeat(2,1fr)}.tabs{display:flex;overflow:auto}.tabs button{white-space:nowrap}.actions{grid-template-columns:1fr}.stage{min-height:330px}}
</style></head>
<body><header><a href="custom_lobby.html">اللوبي</a><h1>🪖 تخصيص المحارب</h1><a href="mini_militia_nitro_customization.html">النفاثة</a></header><main><section class="stage"><div class="aura"></div><div class="soldier" id="soldier">🪖</div><div class="flame" id="flame">🔥</div><div class="info"><h2 id="name">الكوماندوز التكتيكي</h2><p id="stats">قوة النفاثة +15% • استقرار السلاح +20%</p></div><div class="actions"><button id="rotate">🔄 تدوير</button><button id="boost">🚀 تجربة النفاثة</button><button id="win">🎖️ حركة النصر</button></div></section><nav class="tabs"><button class="active" data-tab="skins">👕 الأزياء</button><button data-tab="headgear">🪖 القبعات</button><button data-tab="masks">🕶️ الأقنعة</button><button data-tab="nitro">🔥 النفاثة</button></nav><section><h2 id="sectionTitle">أزياء الكوماندوز</h2><div class="grid" id="items"></div></section></main><div class="toast" id="toast"></div><script>
const sets={skins:[['🪖','الكوماندوز الكلاسيكي','+5% سرعة ركض',1],['🤖','السايبر المقاتل','+10% سرعة نفاثة',1],['🌾','قناص الصحراء','+15% تمويه',1],['👑','المحارب الذهبي','هالة ذهبية',0],['☣️','الغاز السام','مناعة ضد الغاز',0],['🥷','نينجا الظل','سرعة اندفاع',0]],headgear:[['🧑‍✈️','خوذة الطيار النفاث','+12% نفاثة',1],['💀','قناع الجمجمة','رؤية ليلية',1],['🎖️','قبعة الكوماندوز','سرعة تصويب',1]],masks:[['🕶️','نظارات تكتيكية','دقة +10%',1],['😷','قناع الغاز','مناعة غاز',1],['👓','منظار حراري','كشف الأعداء',0]],nitro:[['💜🔥','لهب البنفسج النيوني','+18% اندفاع',1],['💚🔥','الغاز الأخضر السام','+15% دوام',1],['🔥🌋','اللهب البركاني','+20% لهب',1],['⚡🔵','البرق الأزرق','لهب كلاسيكي',1]]};let tab='skins';const $=s=>document.querySelector(s);function toast(t){const x=$('#toast');x.textContent=t;x.classList.add('show');setTimeout(()=>x.classList.remove('show'),1800)}function render(){const labels={skins:'أزياء الكوماندوز',headgear:'خوذات وقبعات المعركة',masks:'الأقنعة والنظارات',nitro:'تأثيرات لهب النفاثة'};$('#sectionTitle').textContent=labels[tab];$('#items').innerHTML=sets[tab].map((x,i)=>`<article class="item ${x[3]?'':'locked'}" data-i="${i}"><div class="icon">${x[0]}</div><b>${x[1]}</b><small>${x[2]}</small><button class="equip">${x[3]?'تجهيز الآن':'مغلق 🔒'}</button></article>`).join('');document.querySelectorAll('.item').forEach((c,i)=>c.onclick=()=>{if(!sets[tab][i][3])return toast('هذا العنصر مغلق');document.querySelectorAll('.item').forEach(x=>x.classList.remove('equipped'));c.classList.add('equipped');$('#name').textContent=sets[tab][i][1];$('#stats').textContent=sets[tab][i][2];toast('تم تجهيز '+sets[tab][i][1])})}document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-tab]').forEach(x=>x.classList.remove('active'));b.classList.add('active');tab=b.dataset.tab;render()});$('#rotate').onclick=()=>$('#soldier').animate([{transform:'rotateY(0)'},{transform:'rotateY(360deg)'}],700);$('#boost').onclick=()=>{$('#flame').animate([{transform:'scale(1)'},{transform:'scale(1.7)'},{transform:'scale(1)'}],900);toast('تم تشغيل النفاثة')};$('#win').onclick=()=>{$('#soldier').animate([{transform:'translateY(0)'},{transform:'translateY(-35px) rotate(-8deg)'},{transform:'translateY(0)'}],900);toast('حركة النصر!')};render();
</script></body></html>
