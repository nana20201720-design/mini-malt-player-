<!doctype html>
<html lang="ar" dir="rtl">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mini Militia — Combat</title>
<style>
:root{--bg:#080f0b;--panel:#18241b;--green:#a1d580;--gold:#ffb955;--cyan:#00daf3;--red:#ff7865;--text:#edf4e8}*{box-sizing:border-box}body{margin:0;min-height:100vh;color:var(--text);font-family:Arial,sans-serif;background:radial-gradient(circle at 50% 35%,#46533b,#111b15 48%,#080f0b 85%);overflow-x:hidden}.top{display:flex;justify-content:space-between;align-items:center;padding:15px 18px;background:#101a13dd;position:sticky;top:0;z-index:4;border-bottom:2px solid #344936}.top a{color:var(--text);text-decoration:none;padding:9px 12px;background:#25352a;border-radius:8px}.hud{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;padding:12px}.pill{background:#17251bdd;padding:8px 13px;border-radius:9px;border:1px solid #456046}.arena{max-width:980px;height:650px;margin:10px auto 20px;position:relative;overflow:hidden;border:3px solid #4b594b;border-radius:16px;background:linear-gradient(#1e2a23aa,#0a120ddd),radial-gradient(ellipse at 50% 20%,#64754e,#18241b 60%)}.arena:before{content:"";position:absolute;inset:0;opacity:.25;background:repeating-linear-gradient(0deg,transparent 0 65px,#dce7d222 65px 67px),repeating-linear-gradient(90deg,transparent 0 110px,#dce7d222 110px 112px)}.soldier{position:absolute;left:50%;top:43%;transform:translate(-50%,-50%);font-size:130px;filter:drop-shadow(0 14px 8px #000);z-index:2;transition:.15s}.jet{position:absolute;left:50%;top:60%;transform:translateX(-50%);font-size:85px;color:var(--gold);text-shadow:0 0 18px #ff6b00;animation:flame .35s infinite alternate}.crosshair{position:absolute;inset:0;pointer-events:none;background:radial-gradient(circle at 50% 45%,transparent 0 12%,#00daf322 12.2% 12.5%,transparent 12.7% 25%,#00daf31b 25.2% 25.5%,transparent 25.7%)}.enemy{position:absolute;font-size:58px;cursor:pointer;z-index:3;filter:drop-shadow(4px 5px 3px #000);animation:float 2s infinite alternate}.e1{top:22%;left:17%}.e2{top:30%;right:18%}.e3{bottom:18%;left:30%}.e4{bottom:24%;right:28%}.controls{max-width:980px;margin:auto;display:grid;grid-template-columns:repeat(4,1fr);gap:10px;padding:0 14px 20px}.controls button{min-height:50px;border:0;border-radius:10px;background:#25352a;color:var(--text);font-weight:900;cursor:pointer}.controls button:hover{filter:brightness(1.25)}.controls .fire{background:var(--red);color:#310b08}.controls .boost{background:var(--cyan);color:#00252b}.toast{position:fixed;bottom:20px;left:50%;transform:translate(-50%,20px);opacity:0;background:#17251fee;border:2px solid var(--green);padding:12px 18px;border-radius:9px;transition:.2s;z-index:8}.toast.show{opacity:1;transform:translate(-50%,0)}.reward{display:none;position:fixed;inset:0;background:#000b;z-index:7;place-items:center}.reward.open{display:grid}.reward-card{width:min(560px,92vw);padding:25px;text-align:center;border:3px solid var(--gold);border-radius:16px;background:radial-gradient(circle,#7b5a1c,#182119 65%);box-shadow:0 0 40px #ffbd3c88}.reward-card h2{font-size:38px;margin:0;text-shadow:3px 3px #000}.loot{display:flex;justify-content:center;gap:15px;flex-wrap:wrap;font-size:55px;margin:20px 0;animation:pop .5s both}.reward-card button{padding:12px 24px;border:0;border-radius:8px;background:var(--gold);font-weight:900;cursor:pointer}@keyframes flame{to{transform:translateX(-50%) scale(1.18);opacity:.65}}@keyframes float{to{transform:translateY(-12px)}}@keyframes pop{from{transform:scale(.3);opacity:0}to{transform:scale(1);opacity:1}}@media(max-width:600px){.arena{height:500px;border-radius:0}.soldier{font-size:95px}.jet{font-size:65px}.controls{grid-template-columns:repeat(2,1fr)}}
</style></head><body><header class="top"><h1>⚔ MINI MILITIA COMBAT</h1><a href="custom_lobby.html">اللوبي</a><a href="mini_militia_armory.html">الترسانة</a></header><div class="hud"><span class="pill">النقاط: <b id="score">0</b></span><span class="pill">الذخيرة: <b id="ammo">30</b></span><span class="pill">النفاثة: <b id="fuel">100</b>%</span></div><main class="arena" id="arena"><div class="crosshair"></div><div class="soldier" id="soldier">🪖</div><div class="jet" id="jet">🔥</div><div class="enemy e1" data-points="100">👾</div><div class="enemy e2" data-points="150">👾</div><div class="enemy e3" data-points="200">👾</div><div class="enemy e4" data-points="250">👾</div></main><div class="controls"><button class="fire" id="fire">🔫 إطلاق</button><button class="boost" id="boost">🚀 نفاثة</button><button id="reload">🔄 تلقيم</button><button id="loot">🎁 فتح الغنيمة</button></div><div class="toast" id="toast"></div><div class="reward" id="reward"><div class="reward-card"><h2>LOOT UNLOCKED!</h2><div class="loot">💎 🪙 🎴 🔫</div><p>حصلت على مكافآت قتالية جديدة</p><button id="close">متابعة</button></div></div><script>
let score=0,ammo=30,fuel=100;const $=s=>document.querySelector(s),toast=t=>{const x=$('#toast');x.textContent=t;x.classList.add('show');setTimeout(()=>x.classList.remove('show'),1600)};function update(){$('#score').textContent=score;$('#ammo').textContent=ammo;$('#fuel').textContent=fuel}document.querySelectorAll('.enemy').forEach(e=>e.onclick=()=>{score+=Number(e.dataset.points);e.style.display='none';toast('إصابة مؤكدة +'+e.dataset.points);update()});$('#fire').onclick=()=>{if(ammo>0){ammo--;toast('تم إطلاق النار');document.querySelector('.soldier').style.transform='translate(-50%,-50%) rotate(-4deg)';setTimeout(()=>$('.soldier').style.transform='translate(-50%,-50%)',130);update()}else toast('الذخيرة فارغة')};$('#reload').onclick=()=>{ammo=30;toast('تم تلقيم السلاح');update()};$('#boost').onclick=()=>{if(fuel>=20){fuel-=20;$('.soldier').animate([{transform:'translate(-50%,-50%)'},{transform:'translate(-50%,-85%)'},{transform:'translate(-50%,-50%)'}],700);toast('تم تشغيل النفاثة');update()}else toast('وقود النفاثة غير كافٍ')};$('#loot').onclick=()=>$('#reward').classList.add('open');$('#close').onclick=()=>$('#reward').classList.remove('open');update();
</script></body></html>
