<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mini Militia Combat</title><style>:root{--green:#a1d580;--gold:#ffb955;--cyan:#00daf3;--red:#ff7865}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#070e0a;color:#edf4e8;font-family:Arial,sans-serif}.top{position:sticky;top:0;z-index:5;display:flex;justify-content:space-between;align-items:center;padding:14px 18px;background:#101a13ee;backdrop-filter:blur(12px);border-bottom:2px solid #405442}.top a{color:#fff;text-decoration:none;background:#27392b;border-radius:8px;padding:9px 12px}.hud{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;padding:12px}.pill{background:#17251d;border:1px solid #49624b;padding:8px 14px;border-radius:9px}.arena{height:min(68vh,650px);max-width:1000px;min-height:470px;position:relative;margin:8px auto 16px;overflow:hidden;border:3px solid #516350;border-radius:16px;background:radial-gradient(circle at 50% 32%,#73865a 0,#31422f 32%,#111c15 72%);box-shadow:0 0 40px #00daf322,inset 0 0 80px #000b}.arena:before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(0deg,transparent 0 70px,#dbead51b 70px 72px),repeating-linear-gradient(90deg,transparent 0 110px,#dbead51b 110px 112px);animation:scan 7s linear infinite}.arena:after{content:"";position:absolute;inset:-20%;background:conic-gradient(from 0deg,transparent,#00daf318,transparent 20%,#ffb95518,transparent 40%);animation:spin 12s linear infinite}.cross{position:absolute;inset:0;background:radial-gradient(circle at 50% 45%,transparent 0 13%,#00daf344 13.2% 13.5%,transparent 13.7% 27%,#00daf322 27.2% 27.5%,transparent 27.7%);animation:pulse 2s infinite}.soldier{position:absolute;z-index:2;left:50%;top:43%;font-size:130px;filter:drop-shadow(0 18px 8px #000);animation:hover 2.6s ease-in-out infinite}.jet{position:absolute;z-index:1;left:50%;top:58%;font-size:96px;color:#ffb52f;text-shadow:0 0 18px #ff4b00,0 0 40px #ffb000;animation:flame .22s infinite alternate}.enemy{position:absolute;z-index:3;font-size:58px;cursor:pointer;filter:drop-shadow(4px 5px 3px #000);animation:float 2s infinite alternate}.e1{top:18%;left:14%}.e2{top:25%;right:15%}.e3{bottom:17%;left:27%}.e4{bottom:23%;right:25%}.enemy.dead{animation:explode .5s forwards;pointer-events:none}.controls{max-width:1000px;margin:auto;padding:0 14px 22px;display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.controls button{min-height:50px;border:0;border-radius:10px;background:#27392b;color:#fff;font-weight:900;cursor:pointer}.fire{background:var(--red)!important}.boost{background:var(--cyan)!important;color:#00252b!important}.loot{background:var(--gold)!important;color:#342000!important}.toast{position:fixed;z-index:9;bottom:20px;left:50%;opacity:0;transform:translate(-50%,20px);background:#17251fee;border:2px solid var(--green);padding:12px 18px;border-radius:9px;transition:.25s}.toast.show{opacity:1;transform:translate(-50%,0)}.modal{display:none;place-items:center;position:fixed;inset:0;z-index:8;background:#000b}.modal.open{display:grid}.reward{width:min(560px,92vw);padding:25px;text-align:center;border:3px solid var(--gold);border-radius:16px;background:radial-gradient(circle,#86651f,#172118 65%);box-shadow:0 0 50px #ffb52f99}.reward h2{font-size:38px;margin:0;text-shadow:3px 3px #000}.items{display:flex;justify-content:center;gap:18px;font-size:56px;margin:20px 0;animation:pop .5s both}.reward button{border:0;border-radius:8px;padding:12px 24px;background:var(--gold);font-weight:900;cursor:pointer}@keyframes hover{50%{transform:translateY(-17px)}}@keyframes flame{to{transform:translateX(-50%) scale(1.2);opacity:.65}}@keyframes float{to{transform:translateY(-14px)}}@keyframes scan{to{background-position:0 140px,110px 0}}@keyframes spin{to{transform:rotate(360deg)}}@keyframes pulse{50%{opacity:.45}}@keyframes explode{to{transform:scale(2.2) rotate(30deg);opacity:0}}@keyframes pop{from{transform:scale(.3);opacity:0}to{transform:scale(1);opacity:1}}@media(max-width:600px){.controls{grid-template-columns:repeat(2,1fr)}.soldier{font-size:95px}.jet{font-size:70px}.arena{border-radius:0}}
</style></head><body><header class="top"><b>⚔ MINI MILITIA COMBAT</b><nav><a href="custom_lobby.html">اللوبي</a> <a href="mini_militia_armory.html">الترسانة</a></nav></header><div class="hud"><span class="pill">النقاط: <b id="score">0</b></span><span class="pill">الذخيرة: <b id="ammo">30</b></span><span class="pill">النفاثة: <b id="fuel">100</b>%</span></div><main class="arena"><div class="cross"></div><div class="soldier" id="soldier">🪖</div><div class="jet">🔥</div><div class="enemy e1">👾</div><div class="enemy e2">👾</div><div class="enemy e3">👾</div><div class="enemy e4">👾</div></main><div class="controls"><button class="fire" id="fire">🔫 إطلاق</button><button class="boost" id="boost">🚀 نفاثة</button><button id="reload">🔄 تلقيم</button><button class="loot" id="loot">🎁 افتح الغنيمة</button></div><div id="toast" class="toast"></div><div id="modal" class="modal"><div class="reward"><h2>LOOT UNLOCKED!</h2><div class="items">💎 🪙 🎴 🔫</div><p>تم فتح مكافآت جديدة!</p><button id="close">متابعة</button></div></div><script>let score=0,ammo=30,fuel=100;const $=s=>document.querySelector(s),say=t=>{let x=$('#toast');x.textContent=t;x.classList.add('show');setTimeout(()=>x.classList.remove('show'),1600)};function draw(){$('#score').textContent=score;$('#ammo').textContent=ammo;$('#fuel').textContent=fuel}document.querySelectorAll('.enemy').forEach(e=>e.onclick=()=>{if(e.classList.contains('dead'))return;score+=100;e.classList.add('dead');say('إصابة مؤكدة +100');draw()});$('#fire').onclick=()=>{if(!ammo)return say('الذخيرة فارغة');ammo--;$('#soldier').animate([{transform:'translate(-50%,-50%) rotate(-6deg)'},{transform:'translate(-50%,-50%) rotate(0)'}],180);say('تم إطلاق النار');draw()};$('#reload').onclick=()=>{ammo=30;say('تم تلقيم السلاح');draw()};$('#boost').onclick=()=>{if(fuel<20)return say('وقود النفاثة غير كافٍ');fuel-=20;$('#soldier').animate([{top:'43%'},{top:'18%'},{top:'43%'}],700);say('تم تشغيل النفاثة');draw()};$('#loot').onclick=()=>$('#modal').classList.add('open');$('#close').onclick=()=>$('#modal').classList.remove('open');draw();</script></body></html>
