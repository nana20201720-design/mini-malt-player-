<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mini Militia Settings</title><style>*{box-sizing:border-box}body{margin:0;background:#0d1510;color:#e8f0e2;font-family:Arial,sans-serif}header{padding:18px;background:#17251b;border-bottom:2px solid #405542;display:flex;justify-content:space-between;align-items:center}header a{color:#fff;text-decoration:none;background:#2b4130;padding:9px;border-radius:8px}main{max-width:760px;margin:auto;padding:18px}.tabs,.row{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.tabs button,.row button,.save{border:0;border-radius:9px;padding:12px;background:#25372a;color:#fff;font-weight:bold;cursor:pointer}.tabs .active,.save{background:#ffb955;color:#392400}.setting{background:#19251b;border:1px solid #405542;border-radius:12px;padding:15px;margin:12px 0}.setting h3{margin:0 0 8px}.slider{width:100%}.switch{float:left;background:#3f513f;color:#fff}.switch.on{background:#63e38a;color:#09200e}.save{width:100%;margin-top:10px;font-size:18px}.toast{position:fixed;bottom:20px;left:50%;transform:translate(-50%,20px);opacity:0;background:#17251d;border:2px solid #63e38a;padding:12px 18px;border-radius:9px;transition:.2s}.toast.show{opacity:1;transform:translate(-50%,0)}@media(max-width:500px){.tabs{grid-template-columns:repeat(2,1fr)}}
</style></head><body><header><a href="custom_lobby.html">اللوبي</a><h1>⚙ إعدادات المعركة</h1><a href="mini_militia_combat.html">القتال</a></header><main><nav class="tabs"><button class="active">🎮 التحكم</button><button>🔊 الصوتيات</button><button>🎨 الرسومات</button></nav><section class="setting"><h3>حساسية التصويب: <b id="value">75%</b></h3><input class="slider" id="sensitivity" type="range" min="10" max="100" value="75"></section><section class="setting"><h3>نمط الإطلاق</h3><div class="row"><button class="active">التصويب المزدوج</button><button>السحب للتصويب</button><button>إطلاق تلقائي</button></div></section><section class="setting"><h3>مساعد التصويب <button class="switch on">مفعل</button></h3><p>يساعد على تثبيت التصويب أثناء القفز والطيران.</p></section><section class="setting"><h3>تسارع النفاثة <button class="switch on">مفعل</button></h3><p>شغّل النفاثة تلقائيًا عند دفع عصا الحركة لأقصى مدى.</p></section><button class="save" id="save">✓ حفظ وتطبيق الإعدادات</button></main><div id="toast" class="toast"></div><script>const range=document.querySelector('#sensitivity'),value=document.querySelector('#value'),toast=document.querySelector('#toast');range.oninput=()=>value.textContent=range.value+'%';document.querySelectorAll('.switch').forEach(b=>b.onclick=()=>{b.classList.toggle('on');b.textContent=b.classList.contains('on')?'مفعل':'متوقف'});document.querySelectorAll('.row button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.row button').forEach(x=>x.classList.remove('active'));b.classList.add('active')});document.querySelector('#save').onclick=()=>{localStorage.setItem('sensitivity',range.value);toast.textContent='تم حفظ الإعدادات';toast.classList.add('show');setTimeout(()=>toast.classList.remove('show'),1800)}</script></body></html>
