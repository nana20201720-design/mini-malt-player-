<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b140e"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="assets/mini-militia-icon.svg" type="image/svg+xml"><title>Mini Militia — Loading</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;overflow:hidden;background:#07100b;color:#fff;font-family:Arial,sans-serif}.screen{position:relative;min-height:100vh;display:grid;place-items:center;padding:20px;background:linear-gradient(#07100bcc,#07100b88),radial-gradient(circle at 50% 30%,#385239,#07100b 72%)}.screen:before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(0deg,transparent 0 4px,#0003 4px 6px);pointer-events:none}.card{position:relative;width:min(610px,94vw);padding:24px 18px;text-align:center;border:2px solid #668365;border-radius:22px;background:#09140ee8;box-shadow:0 0 45px #00daf333,0 18px 50px #0009}.icon{width:150px;height:150px;margin:auto;animation:float 2.8s ease-in-out infinite;filter:drop-shadow(0 0 20px #00daf3aa)}.icon img{width:100%;height:100%}.logo{margin:10px 0 0;font-size:clamp(34px,9vw,72px);font-weight:900;letter-spacing:3px;color:#ffd65c;text-shadow:4px 4px #12100a}.sub{font-size:clamp(18px,4vw,30px);font-weight:900;color:#dfeee0;letter-spacing:2px}.radar{height:150px;width:150px;margin:16px auto;border:1px dashed #00daf3;border-radius:50%;background:radial-gradient(circle,#00daf355 1px,transparent 2px);background-size:18px 18px;animation:spin 6s linear infinite;box-shadow:0 0 30px #00daf355 inset}.tip{color:#c9e7c6;min-height:24px}.bar{height:22px;background:#050a06;border:2px solid #5b6e5e;border-radius:9px;overflow:hidden}.fill{height:100%;width:0;background:linear-gradient(90deg,#24d56a,#ffd65c,#ec6b2d);box-shadow:0 0 16px #ffd65c;transition:width .3s}.percent{display:block;margin-top:8px;color:#ffd65c;font-weight:900}@keyframes spin{to{transform:rotate(360deg)}}@keyframes float{50%{transform:translateY(-10px) rotate(-2deg)}}@media(max-width:500px){.icon{width:120px;height:120px}.radar{height:110px;width:110px}}
</style></head><body><main class="screen"><section class="card"><div class="icon"><img src="assets/mini-militia-icon.svg" alt="Mini Militia icon"></div><div class="logo">MINI MILITIA</div><div class="sub">DOODLE ARMY 2</div><div class="radar"></div><p class="tip" id="tip">جاري تجهيز ساحة المعركة...</p><div class="bar"><div class="fill" id="fill"></div></div><span class="percent" id="percent">0%</span></section></main><script>let p=0;const tips=['فحص العتاد...','مزامنة النفاثة...','تحميل الخرائط...','تجهيز اللاعبين...'];const timer=setInterval(()=>{p=Math.min(100,p+Math.ceil(Math.random()*5));document.querySelector('#fill').style.width=p+'%';document.querySelector('#percent').textContent=p+'%';document.querySelector('#tip').textContent=tips[Math.min(3,Math.floor(p/25))];if(p===100){clearInterval(timer);setTimeout(()=>location.href='custom_lobby.html',500)}},300)</script></body></html>
