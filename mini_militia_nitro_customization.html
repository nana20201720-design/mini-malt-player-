<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mini Militia Nitro</title><style>:root{--bg:#0b120d;--panel:#17241a;--line:#405b43;--green:#66ef91;--gold:#ffc44b;--purple:#d875ff;--cyan:#3be5ff}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 50% 20%,#34472f,#0b120d 68%);color:#eff5e9;font-family:Arial,sans-serif}header{position:sticky;top:0;z-index:3;padding:14px 16px;background:#111b14ed;border-bottom:3px solid #314632;display:flex;justify-content:space-between;align-items:center}header a{color:#fff;text-decoration:none;background:#263a2a;padding:9px;border-radius:8px}h1{margin:0;color:var(--gold);font-size:clamp(22px,5vw,38px)}main{max-width:900px;margin:auto;padding:16px}.preview{height:330px;position:relative;display:flex;align-items:center;justify-content:center;background:#122017;border:2px solid var(--line);border-radius:16px;overflow:hidden;box-shadow:0 0 30px #d875ff22}.preview:before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(0deg,transparent 0 32px,#3be5ff18 32px 34px);animation:scan 4s linear infinite}.avatar{font-size:125px;z-index:2;animation:float 2.4s infinite ease-in-out}.trail{position:absolute;top:205px;font-size:85px;color:var(--purple);text-shadow:0 0 25px currentColor;animation:jet .2s infinite alternate}.cards{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-top:16px}.card{background:var(--panel);border:2px solid var(--line);border-radius:12px;padding:12px;cursor:pointer;transition:.2s}.card:hover,.card.active{border-color:var(--gold);transform:translateY(-4px);box-shadow:0 0 20px #ffc44b44}.icon{font-size:45px;text-align:center}.card button{width:100%;margin-top:8px;padding:10px;border:0;border-radius:8px;background:var(--green);font-weight:bold;cursor:pointer}.toast{position:fixed;bottom:20px;left:50%;transform:translate(-50%,20px);opacity:0;background:#17251d;border:2px solid var(--green);padding:12px 18px;border-radius:9px;transition:.25s}.toast.show{opacity:1;transform:translate(-50%,0)}@keyframes float{50%{transform:translateY(-16px)}}@keyframes jet{to{transform:scale(1.2);opacity:.65}}@keyframes scan{to{background-position:0 68px}}@media(max-width:560px){.cards{grid-template-columns:1fr}.preview{height:280px}.avatar{font-size:100px}.trail{top:180px;font-size:65px}}
</style></head><body><header><a href="character_customization.html">الشخصية</a><h1>🔥 Nitro Trails</h1><a href="mini_militia_combat.html">القتال</a></header><main><section class="preview"><div class="avatar">🪖</div><div class="trail" id="trail">💜🔥</div></section><h2>اختر تأثير النفاثة</h2><section class="cards"><article class="card active" data-color="#d875ff" data-icon="💜🔥"><div class="icon">💜🔥</div><h3>لهب البنفسج النيوني</h3><p>+18% اندفاع وتسارع نفاث</p><button>مُجهز حالياً</button></article><article class="card" data-color="#66ef91" data-icon="💚🔥"><div class="icon">💚🔥</div><h3>الغاز الأخضر السام</h3><p>+15% دوام النفاثة</p><button>تجهيز الآن</button></article><article class="card" data-color="#ff8b28" data-icon="🔥🌋"><div class="icon">🔥🌋</div><h3>اللهب البركاني</h3><p>شرارات حارقة +20%</p><button>تجهيز الآن</button></article><article class="card" data-color="#3be5ff" data-icon="⚡🔵"><div class="icon">⚡🔵</div><h3>البرق التكتيكي الأزرق</h3><p>اللهب الأصلي الكلاسيكي</p><button>تجهيز الآن</button></article></section></main><div class="toast" id="toast"></div><script>const trail=document.querySelector('#trail'),toast=document.querySelector('#toast');function say(t){toast.textContent=t;toast.classList.add('show');setTimeout(()=>toast.classList.remove('show'),1800)}document.querySelectorAll('.card').forEach(c=>c.onclick=()=>{document.querySelectorAll('.card').forEach(x=>x.classList.remove('active'));c.classList.add('active');trail.textContent=c.dataset.icon;trail.style.color=c.dataset.color;trail.style.textShadow='0 0 28px '+c.dataset.color;say('تم تجهيز '+c.querySelector('h3').textContent)});</script></body></html>
